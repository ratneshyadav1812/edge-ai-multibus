<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban Road Intelligence</title>

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Manrope', 'system-ui', 'sans-serif'] },
      colors: { asphalt: { 950: '#0f1216', 900: '#161a20', 800: '#1e232b', 700: '#2a313b', 500: '#6b7585', 300: '#aab3c0' } }
    } }
  };
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
  html, body { height: 100%; }
  .leaflet-container { background: #0f1216; }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1e232b; color: #e7ebf1; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.45; }
  .pin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #0f1216; box-shadow: 0 0 0 2px var(--c); background: var(--c); }
  .pin.fresh { animation: ping 1.4s ease-out 2; }
  @keyframes ping { 0% { box-shadow: 0 0 0 2px var(--c), 0 0 0 2px var(--c); } 100% { box-shadow: 0 0 0 2px var(--c), 0 0 0 22px transparent; } }
</style>
</head>

<body class="bg-asphalt-950 text-slate-200 font-sans antialiased">
<div class="flex flex-col h-full">
  <header class="flex flex-wrap items-center justify-between gap-3 px-5 py-3 bg-asphalt-900 border-b border-asphalt-700">
    <div>
      <h1 class="text-lg font-extrabold tracking-tight">Urban Road Intelligence</h1>
      <p class="text-xs text-asphalt-500">Live detections from bus-mounted edge cameras</p>
    </div>
    <div class="flex items-center gap-5">
      <div id="status" class="flex items-center gap-2 rounded-full bg-asphalt-800 border border-asphalt-700 px-3 py-1.5 text-xs font-semibold" role="status" aria-live="polite">
        <span id="status-dot" class="h-2 w-2 rounded-full bg-asphalt-500"></span>
        <span id="status-text">Connecting…</span>
      </div>
    </div>
  </header>
  <main class="flex flex-1 min-h-0 flex-col md:flex-row">
    <section class="relative flex-1 min-h-[45vh]" aria-label="Event map">
      <div id="map" class="absolute inset-0"></div>
    </section>
  </main>
<script>
  const SERVER_URL = 'http://localhost:8000';
  const map = L.map('map', { zoomControl: true }).setView([29.9457, 76.8116], 14);

  fetch(`${SERVER_URL}/api/config`)
    .then(r => r.json())
    .then(({ geoapify_api_key }) => {
      L.tileLayer(
        `https://maps.geoapify.com/v1/tile/dark-matter/{z}/{x}/{y}.png?apiKey=${geoapify_api_key}`,
        { attribution: '&copy; <a href="https://geoapify.com/">Geoapify</a> &copy; OpenMapTiles &copy; OpenStreetMap', maxZoom: 20 }
      ).addTo(map);
    })
    .catch(() => {
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">CARTO</a>', subdomains: 'abcd', maxZoom: 19,
      }).addTo(map);
    });
</script>
</div>
</body>
</html>
