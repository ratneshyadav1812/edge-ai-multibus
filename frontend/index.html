<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban Road Intelligence</title>

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['Manrope', 'system-ui', 'sans-serif'] },
      colors: { asphalt: { 950: '#0f1216', 900: '#161a20', 800: '#1e232b', 700: '#2a313b', 500: '#6b7585', 300: '#aab3c0' } }
    } }
  };
</script>
</head>

<body class="bg-asphalt-950 text-slate-200 font-sans antialiased">
<div class="flex flex-col h-full">
  <header class="flex flex-wrap items-center justify-between gap-3 px-5 py-3 bg-asphalt-900 border-b border-asphalt-700">
    <div>
      <h1 class="text-lg font-extrabold tracking-tight">Urban Road Intelligence</h1>
      <p class="text-xs text-asphalt-500">Live detections from bus-mounted edge cameras</p>
    </div>
  </header>
  <main class="flex flex-1 min-h-0 flex-col md:flex-row">
  </main>
</div>
</body>
</html>
